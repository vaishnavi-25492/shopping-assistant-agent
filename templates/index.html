<!DOCTYPE html>
<html>
<head>
    <title>Shopping Assistant</title>
</head>

<body>

    <h1>🛒 Shopping Assistant</h1>

    <p>Tell me what product you are looking for.</p>

    <form action="/search" method="POST">

        <input
            type="text"
            name="query"
            placeholder="Example: Phone under ₹30000 with good camera"
            required
        >

        <button type="submit">
            Find Products
        </button>

    </form>

</body>
</html>
